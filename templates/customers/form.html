{% extends "base.html" %}

{% block page_title %}{{ action_title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h3 class="card-title">
            <i class="fa-solid fa-user-pen"></i> {{ action_title }}
        </h3>
        <a href="{{ url_for('customers.index') }}" class="btn btn-sm btn-secondary">
            &larr; Back to Customers
        </a>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Diya Patel" 
                       value="{{ customer.name if customer else '' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="customer@example.com" 
                       value="{{ customer.email if customer else '' }}" required>
                <small style="color: var(--text-muted); font-size: 0.75rem;">Must be unique for each customer</small>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210" 
                       value="{{ customer.phone if customer and customer.phone else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="city">City *</label>
                <input type="text" id="city" name="city" class="form-control" placeholder="e.g. Mumbai" 
                       value="{{ customer.city if customer else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="address">Street Address</label>
            <input type="text" id="address" name="address" class="form-control" placeholder="Apartment, building, street..." 
                   value="{{ customer.address if customer and customer.address else '' }}">
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="state">State / Province</label>
                <input type="text" id="state" name="state" class="form-control" placeholder="e.g. Maharashtra" 
                       value="{{ customer.state if customer and customer.state else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="postal_code">Postal / PIN Code</label>
                <input type="text" id="postal_code" name="postal_code" class="form-control" placeholder="e.g. 400050" 
                       value="{{ customer.postal_code if customer and customer.postal_code else '' }}">
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            <a href="{{ url_for('customers.index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save Profile</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
